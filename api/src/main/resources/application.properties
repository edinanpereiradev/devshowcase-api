spring.application.name=api

# Configuracao do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:devshowcasedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Definir o Driver Class
spring.datasource.url=jdbc:postgresql://db.gvtwfqxafgbpkvftowrb.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1MDGHrtL1jJJYZvQ
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto (opcional no Spring Boot recente, mas recomendado)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fix para erro 500 no Swagger/OpenAPI
springdoc.enable-spring-data-rest=false
springdoc.show-actuator=false

# Desativa o H2 Console em produção
spring.h2.console.enabled=false

# Define o comportamento do banco de dados em produção
